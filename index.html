
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About:Blank Embedder</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
}

.popup {
    width: 320px;
    max-width: 90%;
    background: #222;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 10px 40px #000;
}

.popup h3 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 7px;
    margin: 12px 0;
}

button {
    width: 100%;
    padding: 12px;
    background: #5865f2;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background: #4752c4;
}

#message {
    font-size: 13px;
    color: #ff7777;
}
</style>
</head>

<body>

<div class="overlay" id="overlay">
    <div class="popup">
        <h3>About:Blank Embedder</h3>
        <p>Enter a website URL:</p>

        <form id="openForm">
            <input
                id="url"
                type="text"
                placeholder="https://example.com"
                required
            >

            <button type="submit">Embed</button>
            <p id="message"></p>
        </form>
    </div>
</div>

<script>
const form = document.getElementById("openForm");
const field = document.getElementById("url");
const message = document.getElementById("message");

form.addEventListener("submit", function(event) {
    event.preventDefault();

    let value = field.value.trim();

    if (!value) return;

    if (!/^https?:\/\//i.test(value)) {
        value = "https://" + value;
    }

    let parsed;

    try {
        parsed = new URL(value);
    } catch {
        message.textContent = "Please enter a valid website URL.";
        return;
    }

    if (!["http:", "https:"].includes(parsed.protocol)) {
        message.textContent = "Please use HTTP or HTTPS.";
        return;
    }

    const frame = document.createElement("iframe");

    frame.src = parsed.href;
    frame.title = "Embedded website";

    frame.style.cssText = `
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 999999;
        background: white;
    `;

    document.body.innerHTML = "";
    document.body.appendChild(frame);
});
</script>

</body>
</html>
