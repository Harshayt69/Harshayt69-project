<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blank Tab Viewer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #10131b; color: #f4f6fb;
      font: 16px/1.5 system-ui, sans-serif;
    }
    main {
      width: min(560px, 100%); padding: 30px; border-radius: 18px;
      background: #1b2130; border: 1px solid #30394d;
      box-shadow: 0 18px 55px #0006;
    }
    h1 { margin: 0 0 8px; font-size: 27px; }
    p { color: #aeb8cb; margin: 0 0 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input {
      width: 100%; padding: 14px; border-radius: 10px;
      border: 1px solid #414d65; background: #101521; color: white;
      font: inherit; outline: none;
    }
    input:focus { border-color: #8ba8ff; }
    button {
      width: 100%; margin-top: 14px; padding: 13px 16px;
      border: 0; border-radius: 10px; background: #6688ff;
      color: white; font: 700 16px system-ui, sans-serif; cursor: pointer;
    }
    button:hover { background: #7896ff; }
    #message { min-height: 24px; margin-top: 14px; font-size: 14px; }
    .hint { font-size: 13px; margin-top: 18px; color: #8995aa; }
  </style>
</head>
<body>
  <main>
    <h1>Blank Tab Viewer</h1>
    <p>Enter a website address to open it in a new blank tab.</p>
    <form id="openForm">
      <label for="url">Website URL</label>
      <input id="url" type="text" placeholder="https://example.com" autocomplete="url" required>
      <button type="submit">Open in blank tab</button>
    </form>
    <div id="message" role="status"></div>
    <div class="hint">Some websites block being displayed inside another page. If that happens, the preview may not load.</div>
  </main>
  <script>
    const form = document.getElementById('openForm');
    const field = document.getElementById('url');
    const message = document.getElementById('message');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      let value = field.value.trim();
      if (!value) return;

      if (!/^https?:\/\//i.test(value)) value = 'https://' + value;

      let parsed;
      try { parsed = new URL(value); }
      catch {
        message.textContent = 'Please enter a valid website address.';
        return;
      }

      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') {
        message.textContent = 'Please use an http or https website address.';
        return;
      }

      // Open synchronously from the button click so popup blockers are less likely to interfere.
      const blankTab = window.open('about:blank', '_blank');
      if (!blankTab) {
        message.textContent = 'Your browser blocked the new tab. Allow pop-ups for this page and try again.';
        return;
      }

      blankTab.document.title = 'Website Preview';
      const frame = blankTab.document.createElement('iframe');
      frame.src = parsed.href;
      frame.title = 'Website preview';
      frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:white';
      blankTab.document.body.style.cssText = 'margin:0;overflow:hidden';
      blankTab.document.body.appendChild(frame);
      message.textContent = 'Opened a new blank tab.';
    });
  </script>
<script src="https://cdn.jsdelivr.net/gh/Harshayt69/Harshayt69-project@main/script.js"></script>
</body>
</html>
