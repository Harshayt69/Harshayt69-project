<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>About Blank Embedder</title>
</head>
<body>

<button id="embed">embed about:blank</button>

<script>
let website = "";

document.getElementById("embed").onclick = function() {
    const url = prompt("url?");

    if (!url) return;

    try {
        const parsed = new URL(url);

        if (!["https:", "http:"].includes(parsed.protocol)) {
            alert("Enter a valid website URL.");
            return;
        }

        website = parsed.href;
        alert("URL saved! Click Embed about:blank again to open it.");
    } catch {
        alert("Enter a valid URL including https://");
    }
};
</script>

</body>
</html>
