<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedder</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.65);
    display: flex;
    align-items: center;
    justify-content: center;
}

.popup {
    width: 320px;
    background: #222;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 10px 40px #000;
}

.popup h3 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 7px;
    margin: 12px 0;
}

button {
    width: 100%;
    padding: 12px;
    background: #5865f2;
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="overlay" id="overlay">
    <div class="popup">
        <h3>About:Blank Embedder</h3>
        <p>Enter a website URL:</p>

        <input
            id="url"
            type="url"
            placeholder="https://example.com"
        >

        <button onclick="embed()">Embed</button>
    </div>
</div>

<script>
function embed() {
    let url = document.getElementById("url").value.trim();

    try {
        let parsed = new URL(url);

        if (!["https:", "http:"].includes(parsed.protocol)) {
            throw new Error();
        }

        let frame = document.createElement("iframe");

        frame.src = parsed.href;
        frame.style.cssText =
            "position:fixed;inset:0;width:100%;height:100%;border:0;z-index:999999;";

        document.getElementById("overlay").remove();
        document.body.appendChild(frame);

    } catch {
        alert("Please enter a valid website URL.");
    }
}
</script>

</body>
</html>
